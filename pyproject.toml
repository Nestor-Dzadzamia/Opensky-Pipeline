[project]
name = "opensky-pipeline"
version = "0.1.0"
description = "Scheduled ETL that pulls live ADS-B aircraft states from the OpenSky API and loads them into PostgreSQL with deduplication, retry/backoff on rate limits, and logging."
authors = [
    { name = "Nestor-Dzadzamia", email = "ndzad22@freeuni.edu.ge" }
]
requires-python = ">=3.13"
dependencies = [
    "flake8>=7.4.1",
    "httpx2>=2.13.1",
    "pandas>=3.0.6",
    "psycopg2>=2.9.13",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "ruff>=0.17.0",
]

[project.scripts]
opensky-pipeline = "opensky_pipeline.main:main"
opensky-init-db = "opensky_pipeline.db:init_db"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "types-psycopg2>=2.9.21.20261008",
]
